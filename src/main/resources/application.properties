# PostgreSQL Data Source
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/treino_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Pool settings for Cloud DBs (Supabase)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Timezone Configuration (RNF-8)
spring.jackson.time-zone=America/Guayaquil

# Server Port
server.port=${PORT:8081}

# Scheduling (Cron Jobs)
spring.task.scheduling.pool.size=5

# Evolution API v2 WhatsApp Configuration
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8084}
evolution.api.key=${EVOLUTION_API_KEY:treino_super_secret_api_key_2026}
evolution.api.instance-name=${EVOLUTION_API_INSTANCE_NAME:treino-bot}
